name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify desktop bundle
        shell: pwsh
        run: |
          $main = "apps/desktop/out/main/index.js"
          $preload = "apps/desktop/out/preload/index.cjs"
          $renderer = "apps/desktop/out/renderer/index.html"

          foreach ($path in @($main, $preload, $renderer)) {
            if (-not (Test-Path $path)) {
              throw "Expected desktop bundle output is missing: $path"
            }
          }

          $mainSource = Get-Content $main -Raw
          if ($mainSource -notmatch [regex]::Escape("../preload/index.cjs")) {
            throw "Packaged main bundle does not reference the generated CommonJS preload module."
          }

          $preloadSource = Get-Content $preload -Raw
          if ($preloadSource -match "(^|[;\s])import\s") {
            throw "Sandboxed preload must not contain ESM import statements."
          }

      - name: Package Windows
        run: npm run dist:win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Kripl-Studio-Windows
          path: apps/desktop/release/**
          if-no-files-found: error
